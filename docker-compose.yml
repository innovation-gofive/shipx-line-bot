services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: ${APP_URL:?}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?}
      SHIPX_BASE_URL: ${SHIPX_BASE_URL:?}
      SHIPX_API_KEY: ${SHIPX_API_KEY:-}
      SHIPX_BEARER_TOKEN: ${SHIPX_BEARER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_RESPONSE_MODEL: ${OPENAI_RESPONSE_MODEL:-}
      AI_RESPONSE_ENABLED: ${AI_RESPONSE_ENABLED:-true}
      SHIPX_SHIPPING_DATE_IS_DUE_DATE: ${SHIPX_SHIPPING_DATE_IS_DUE_DATE:-true}
      DATABASE_PATH: /app/data/shipx.sqlite
    volumes:
      - shipx-data:/app/data
    init: true
    stop_grace_period: 25s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  shipx-data:
